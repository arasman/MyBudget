# Docker Compose for MyBudget local development
# Usage:
#   Infrastructure only:  docker compose --profile infra up -d
#   Full stack:           docker compose --profile full up -d
# No services start without a --profile flag.

networks:
  mybudget-network:
    driver: bridge

volumes:
  postgres-data:
  seq-data:

services:
  postgres:
    image: postgres:16-alpine
    profiles: [infra, full]
    networks: [mybudget-network]
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file: .env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [infra, full]
    networks: [mybudget-network]
    ports:
      - ${REDIS_PORT:-6379}:6379
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: [infra, full]
    networks: [mybudget-network]
    ports:
      - ${MAILPIT_SMTP_PORT:-1025}:1025
      - ${MAILPIT_UI_PORT:-8025}:8025
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    profiles: [infra, full]
    networks: [mybudget-network]
    ports:
      - ${SEQ_PORT:-5341}:80
    volumes:
      - seq-data:/data
    env_file: .env
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: [infra, full]
    networks: [mybudget-network]
    ports:
      - ${JAEGER_UI_PORT:-16686}:16686
    restart: unless-stopped

  api:
    build:
      context: ./src/MyBudget.Api
      dockerfile: Dockerfile
    profiles: [full]
    networks: [mybudget-network]
    env_file: .env
    depends_on:
      - postgres
      - redis
      - mailpit
      - seq
      - jaeger
    restart: unless-stopped
